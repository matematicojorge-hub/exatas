<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sala de aula</title>
<style>
/* SALA DE AULA — página do professor para usar durante o Meet.
   Setores: barra de ferramentas (em cima) e palco (aula ou quadro).
   Compartilhe ESTA aba no Meet e use a mesa digitalizadora. */
:root{color-scheme:light;--bar:#16213a;--bar2:#22304f;--ink:#e8edf7;--soft:#9aa6bf}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;font:15px/1.3 system-ui,Segoe UI,sans-serif;background:#fff}
.app{display:flex;flex-direction:column;height:100%}
.bar{background:var(--bar);color:var(--ink);display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;padding:5px 8px}
.grp{display:flex;gap:4px;align-items:center}
.grp+.grp{padding-left:8px;border-left:1px solid var(--bar2)}
.bar button,.bar select{min-height:36px;padding:0 8px;border-radius:8px;border:1px solid var(--bar2);background:var(--bar2);color:var(--ink);font:600 13px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.bar select{width:auto;max-width:150px}
.bar #sel{max-width:190px}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--bar);border-color:var(--ink)}
.bar button:disabled{opacity:.35;cursor:default}
.bar button:focus-visible,.bar select:focus-visible{outline:3px solid #7ea2ff;outline-offset:1px}
.cor{width:28px;min-width:28px;height:28px;min-height:28px!important;padding:0!important;border-radius:50%!important;border:3px solid var(--bar2)!important}
.cor[aria-pressed=true]{outline:3px solid #fff;outline-offset:1px}
.esp{width:34px;padding:0!important;display:grid;place-items:center}
.esp i{display:block;border-radius:50%;background:currentColor}
.pg{color:var(--soft);font-weight:600;min-width:46px;text-align:center}
.so-quadro{display:none}
.quadro .so-quadro{display:flex}
#bExcluir{display:none;background:#d62828;border-color:#d62828}
.temsel #bExcluir{display:inline-block}
.bar .sosel{display:none}
.temsel .bar .sosel{display:inline-block}
.stage{position:relative;flex:1;background:#fff;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;color-scheme:light}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.quadro .stage iframe,.quadro .vazio{display:none}
.mao:not(.quadro) canvas{pointer-events:none}
.mao.quadro canvas{cursor:grab}
.vazio{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#55607a;padding:24px;background:#fbfcff}
.vazio b{display:block;font-size:22px;color:#16213a;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(13,20,34,.45);display:none;place-items:center;z-index:10;padding:12px}
.modal.on{display:grid}
.mbox{background:#fff;color:#16213a;border-radius:14px;padding:18px 20px;width:min(760px,96vw);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mbox h2{margin:0 0 4px;font-size:22px}
.mbox .dica{color:#55607a;font-size:14px;margin:6px 0}
.mbox textarea{width:100%;font:18px/1.4 Consolas,monospace;min-height:80px;border:2px solid #d5ddeb;border-radius:8px;padding:10px;color:#16213a;background:#fbfcff}
.mbox textarea:focus{outline:none;border-color:#2451c7}
.kb{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.kb button{min-height:40px;min-width:42px;padding:0 9px;border:1px solid #d5ddeb;border-radius:8px;background:#f4f7fc;color:#16213a;font:600 16px system-ui,sans-serif;cursor:pointer}
.kb button:hover{border-color:#2451c7}
.kb.tpl button{font-size:14px}
.prev{min-height:90px;border:1px dashed #c9d5ec;border-radius:8px;display:grid;place-items:center;padding:12px;overflow:auto;margin-top:8px;font-size:20px}
.acts{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:12px;flex-wrap:wrap}
.acts button,.acts select{min-height:44px;padding:0 16px;border-radius:8px;border:2px solid #d5ddeb;background:#fff;color:#16213a;font:700 15px system-ui,sans-serif;cursor:pointer}
.acts .pri{background:#d62828;border-color:#d62828;color:#fff}
.acts label{margin-right:auto;font-weight:600;display:flex;gap:8px;align-items:center}
.corlivre{position:relative;width:28px;min-width:28px;height:28px;border-radius:50%;border:3px solid var(--bar2);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);cursor:pointer;overflow:hidden}
.corlivre input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#16213a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar" role="toolbar" aria-label="Ferramentas da sala de aula">
    <!-- SETOR 1: o que mostrar -->
    <div class="grp">
      <select id="sel" aria-label="Escolher aula"></select>
      <input type="file" id="local" accept=".html,.htm,.pdf" hidden>
      <button id="bAula" aria-pressed="true" title="Mostrar a aula (A)">Aula</button>
      <button id="bQuadro" aria-pressed="false" title="Mostrar o quadro (Q)">Quadro</button>
    </div>
    <!-- SETOR 2: ferramentas -->
    <div class="grp">
      <button data-t="sel" aria-pressed="false" title="Selecionar: arraste um retângulo em volta do que quer mover, girar ou apagar (G)">Selecionar</button>
      <button data-t="hand" aria-pressed="true" title="Clicar na aula / mover figuras e rolar o quadro (M). T alterna Mouse e Caneta">Mouse</button>
      <button data-t="pen" aria-pressed="false" title="Caneta (P)">Caneta</button>
      <button data-t="hl" aria-pressed="false" title="Marca-texto (H)">Marca-texto</button>
      <button data-t="reta" aria-pressed="false" title="Régua: traço reto. Segure Shift para travar o ângulo (R)">Régua</button>
      <button data-t="vetor" aria-pressed="false" title="Vetor: seta reta (V)">Vetor</button>
      <button data-t="texto" aria-pressed="false" title="Texto: clique no quadro e digite (X)">Texto</button>
      <button data-t="corr" aria-pressed="false" title="Corretivo: pinta de branco por cima (C)">Corretivo</button>
      <button data-t="eraser" aria-pressed="false" title="Borracha: apaga traços inteiros (E)">Borracha</button>
    </div>
    <!-- SETOR 3: cor e espessura -->
    <div class="grp" id="cores"></div>
    <div class="grp" id="esps"></div>
    <!-- SETOR 4: corrigir -->
    <div class="grp">
      <button id="bUndo" title="Desfazer (Ctrl+Z)">Desfazer</button>
      <button id="bLimpar" title="Apagar tudo desta tela (L)">Limpar</button>
    </div>
    <!-- SETOR 5: só no quadro -->
    <div class="grp so-quadro">
      <select id="inserir" aria-label="Inserir figura">
        <option value="">Inserir…</option>
        <option value="imagem">Imagem do computador…</option>
        <option value="equacao">Equação…</option>
        <optgroup label="Figuras planas"><option value="reta">Reta / segmento</option><option value="ret">Retângulo</option><option value="tri">Triângulo</option><option value="trir">Triângulo retângulo</option><option value="circ">Círculo / elipse</option><option value="los">Losango</option><option value="trap">Trapézio</option><option value="paral">Paralelogramo</option><option value="pent">Pentágono</option><option value="hex">Hexágono</option><option value="eixos">Eixos x e y</option></optgroup>
        <optgroup label="Figuras espaciais"><option value="cubo">Cubo</option><option value="para">Paralelepípedo</option><option value="pir">Pirâmide</option><option value="cil">Cilindro</option><option value="cone">Cone</option><option value="esf">Esfera</option></optgroup>
      </select>
      <input type="file" id="imgArq" accept="image/*" hidden>
      <button id="bEq" title="Inserir equação (Q de quadro + botão)">Equação</button>
      <button id="bFill" aria-pressed="false" title="Preencher as figuras planas com cor clara">Preencher</button>
      <select id="girar" class="sosel" aria-label="Girar ou inverter a seleção"><option value="">Girar…</option><option value="d90">Girar 90° para a direita</option><option value="e90">Girar 90° para a esquerda</option><option value="180">Girar 180°</option><option value="iv">Inverter verticalmente</option><option value="ih">Inverter horizontalmente</option></select>
      <button id="bExcluir" title="Excluir o que está selecionado (Delete)">Excluir</button>
      <select id="fundo" aria-label="Fundo do quadro"><option value="quad">Quadriculado</option><option value="pauta">Pautado</option><option value="branco">Branco</option></select>
      <button id="bAnt" title="Página anterior">◀</button><span class="pg" id="pg">1 / 1</span><button id="bProx" title="Próxima página">▶</button>
      <button id="bNova" title="Nova página (N)">+ Página</button>
      <button id="bSalvar" title="Salvar a página inteira como imagem (S)">Salvar imagem</button>
    </div>
    <div class="grp"><button id="bTela" title="Tela cheia (F)" aria-label="Tela cheia">⛶</button></div>
  </div>
  <div class="stage" id="stage">
    <iframe id="fr" title="Aula"></iframe>
    <div class="vazio" id="vazio"><div><b>Escolha uma aula no menu acima</b>ou clique em “Quadro” para escrever numa folha.</div></div>
    <canvas id="cv"></canvas>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<!-- JANELA: EQUAÇÃO -->
<div class="modal" id="mEq" role="dialog" aria-modal="true" aria-labelledby="tEq"><div class="mbox">
  <h2 id="tEq">Equação</h2>
  <div class="kb tpl" id="kbEqT"></div>
  <div class="kb" id="kbEqS"></div>
  <textarea id="eqTxt" spellcheck="false" placeholder="Clique nos botões ou digite. Ex.: x = \frac{-b \pm \sqrt{\Delta}}{2a}"></textarea>
  <p class="dica">Fração fica com o numerador sobre o denominador. <b>Tab</b> pula para a próxima caixinha vazia. <b>Ctrl+Enter</b> insere.</p>
  <div class="prev" id="eqPrev">Pré-visualização</div>
  <div class="acts"><button id="eqCanc">Cancelar</button><button id="eqOk" class="pri">Inserir no quadro</button></div>
</div></div>

<!-- JANELA: TEXTO -->
<div class="modal" id="mTx" role="dialog" aria-modal="true" aria-labelledby="tTx"><div class="mbox">
  <h2 id="tTx">Texto</h2>
  <div class="kb" id="kbTx"></div>
  <textarea id="txTxt" spellcheck="false" placeholder="Digite aqui. Enter = nova linha."></textarea>
  <div class="acts"><label>Tamanho <select id="txTam"><option value="22">Pequeno</option><option value="30" selected>Médio</option><option value="42">Grande</option><option value="60">Enorme</option></select></label>
  <button id="txCanc">Cancelar</button><button id="txOk" class="pri">Inserir no quadro</button></div>
</div></div>

<script src="aulas.js"></script>
<script>
{
  const $=id=>document.getElementById(id);
  const app=$("app"),stage=$("stage"),fr=$("fr"),cv=$("cv"),ctx=cv.getContext("2d");
  const CORES=[["#16213a","Preto"],["#2451c7","Azul"],["#d62828","Vermelho"],["#0d7a6f","Verde"],["#f2b705","Amarelo"]];
  const ESPS=[[2,"Fina"],[4,"Média"],[8,"Grossa"]];
  const novaPagina=()=>({strokes:[],objs:[],undo:[],qy:0});
  const S={modo:"aula",tool:"hand",cor:CORES[0][0],esp:4,fill:false,grp:null,aula:"",ann:{},pages:[novaPagina()],page:0,fundo:"quad",sx:0,sy:0,sel:null};
  let atual=null,erasing=null,arrasto=null,sujo=true,ultimaEscrita="pen";

  // ================= SETOR A: menus =================
  const NOMES={matematica:"Matemática",fisica:"Física",quimica:"Química"};
  const grupos=[["Aulas",typeof AULAS!=="undefined"?AULAS:[]],["Questões",typeof QUESTOES!=="undefined"?QUESTOES:[]]];
  let h='<option value="">— Escolha a aula —</option>';
  grupos.forEach(([g,l])=>["matematica","fisica","quimica"].forEach(d=>{
    const it=l.filter(a=>a.disciplina===d);if(!it.length)return;
    h+=`<optgroup label="${g} · ${NOMES[d]}">`+it.map(a=>`<option value="${a.arquivo.replace(/"/g,"&quot;")}">${a.titulo.replace(/</g,"&lt;")}${a.protegida?" (senha)":""}</option>`).join("")+"</optgroup>";
  }));
  h+='<option value="__local">Abrir arquivo do computador…</option>';
  $("sel").innerHTML=h;
  $("cores").innerHTML=CORES.map(([c,n],i)=>`<button class="cor" data-c="${c}" style="background:${c}" aria-label="${n}" title="${n} (${i+1})" aria-pressed="${i===0}"></button>`).join("")+`<label class="corlivre" title="Escolher qualquer cor"><input type="color" id="corLivre" value="#7a3cc2" aria-label="Escolher qualquer cor"></label>`;
  $("esps").innerHTML=ESPS.map(([e,n])=>`<button class="esp" data-e="${e}" aria-label="${n}" title="${n}" aria-pressed="${e===S.esp}"><i style="width:${e+3}px;height:${e+3}px"></i></button>`).join("");

  // ================= SETOR B: camadas =================
  const camada=()=>{if(S.modo==="quadro")return S.pages[S.page];return S.ann[S.aula]||(S.ann[S.aula]={strokes:[],objs:[],undo:[],qy:0})};
  const off=()=>S.modo==="aula"?[S.sx,S.sy]:[0,camada().qy];

  let W=0,H=0,dpr=1;
  function medir(){dpr=window.devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;cv.width=W*dpr;cv.height=H*dpr;sujo=true}
  new ResizeObserver(medir).observe(stage);

  // ================= SETOR C: desenho =================
  function fundo(c,w,hh,oy){
    c.fillStyle="#fff";c.fillRect(0,0,w,hh);
    if(S.fundo==="branco")return;
    c.lineWidth=1;
    if(S.fundo==="quad"){
      for(let x=0;x<=w;x+=25){c.strokeStyle=x%125?"#e3e9f5":"#c9d5ec";c.beginPath();c.moveTo(x+.5,0);c.lineTo(x+.5,hh);c.stroke()}
      for(let k=Math.floor(oy/25);k*25-oy<=hh;k++){const y=k*25-oy;c.strokeStyle=k%5?"#e3e9f5":"#c9d5ec";c.beginPath();c.moveTo(0,y+.5);c.lineTo(w,y+.5);c.stroke()}
    }else{
      c.strokeStyle="#cfdcf0";for(let k=Math.max(1,Math.floor(oy/36));k*36-oy<=hh;k++){const y=k*36+24-oy;c.beginPath();c.moveTo(0,y+.5);c.lineTo(w,y+.5);c.stroke()}
      c.strokeStyle="#f3b4b4";c.beginPath();c.moveTo(70.5,0);c.lineTo(70.5,hh);c.stroke();
    }
  }
  const larg=s=>(p)=>s.tool==="hl"?s.esp*5:s.tool==="corr"?s.esp*4+6:s.esp*(s.pen?0.35+1.3*p:1);
  function traco(c,s,ox,oy){
    const P=s.pts;if(!P.length)return;const L=larg(s);
    c.save();c.lineCap="round";c.lineJoin="round";c.strokeStyle=s.cor;c.fillStyle=s.cor;
    if(s.tool==="hl"){c.globalAlpha=.35;c.globalCompositeOperation="multiply"}
    const X=i=>P[i][0]-ox,Y=i=>P[i][1]-oy;
    if(s.tool==="reta"||s.tool==="vetor"){c.lineWidth=Math.max(2,s.esp*.8);
      if(s.tool==="vetor"){const t=10+s.esp*1.5;c.lineWidth=Math.max(2,s.esp*.8);const a=Math.atan2(Y(1)-Y(0),X(1)-X(0)),len=Math.hypot(X(1)-X(0),Y(1)-Y(0));
        const bx=X(1)-Math.cos(a)*t*.8,by=Y(1)-Math.sin(a)*t*.8;c.beginPath();c.moveTo(X(0),Y(0));c.lineTo(len>t?bx:X(1),len>t?by:Y(1));c.stroke();
        c.beginPath();c.moveTo(X(1),Y(1));c.lineTo(X(1)-t*Math.cos(a-.42),Y(1)-t*Math.sin(a-.42));c.lineTo(X(1)-t*Math.cos(a+.42),Y(1)-t*Math.sin(a+.42));c.closePath();c.fill()}
      else{c.beginPath();c.moveTo(X(0),Y(0));c.lineTo(X(1),Y(1));c.stroke()}
      c.restore();return}
    if(P.length===1){c.beginPath();c.arc(X(0),Y(0),L(P[0][2])/2,0,7);c.fill();c.restore();return}
    if(s.tool!=="pen"||!s.pen){
      c.lineWidth=L(.5);c.beginPath();c.moveTo(X(0),Y(0));
      for(let i=1;i<P.length-1;i++)c.quadraticCurveTo(X(i),Y(i),(X(i)+X(i+1))/2,(Y(i)+Y(i+1))/2);
      c.lineTo(X(P.length-1),Y(P.length-1));c.stroke();
    }else{
      let mx=X(0),my=Y(0);
      for(let i=1;i<P.length;i++){
        const nx=i<P.length-1?(X(i)+X(i+1))/2:X(i),ny=i<P.length-1?(Y(i)+Y(i+1))/2:Y(i);
        c.lineWidth=L(P[i][2]);c.beginPath();c.moveTo(mx,my);c.quadraticCurveTo(X(i),Y(i),nx,ny);c.stroke();mx=nx;my=ny;
      }
    }
    c.restore();
  }
  // --- figuras geométricas ---
  const caixa=o=>({x:Math.min(o.x,o.x+o.w),y:Math.min(o.y,o.y+o.h),w:Math.abs(o.w),h:Math.abs(o.h)});
  function seta(c,x1,y1,x2,y2){const a=Math.atan2(y2-y1,x2-x1),t=12;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-t*Math.cos(a-.4),y2-t*Math.sin(a-.4));c.lineTo(x2-t*Math.cos(a+.4),y2-t*Math.sin(a+.4));c.closePath();c.fill()}
  function linha(c,pts,trac){c.setLineDash(trac?[8,6]:[]);c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.stroke();c.setLineDash([])}
  function elipse(c,cx,cy,rx,ry,a0,a1,trac){c.setLineDash(trac?[8,6]:[]);c.beginPath();c.ellipse(cx,cy,Math.max(rx,.1),Math.max(ry,.1),0,a0,a1);c.stroke();c.setLineDash([])}
  function transf(c,o,ox,oy){if(o.rot||o.fx||o.fy){const b=caixa(o),cx=b.x+b.w/2-ox,cy=b.y+b.h/2-oy;c.translate(cx,cy);c.rotate(o.rot||0);c.scale(o.fx?-1:1,o.fy?-1:1);c.translate(-cx,-cy)}}
  function forma(c,o,ox,oy){
    c.save();transf(c,o,ox,oy);c.strokeStyle=o.cor;c.fillStyle=o.cor;c.lineWidth=Math.max(2,o.esp*.75);c.lineJoin="round";c.lineCap="round";
    if(o.k==="img"){const b=caixa(o);if(o.img.complete)c.drawImage(o.img,b.x-ox,b.y-oy,b.w,b.h);c.restore();return}
    if(o.k==="texto"){c.font=`${o.tam}px system-ui,Segoe UI,sans-serif`;c.textBaseline="top";o.txt.split("\n").forEach((l,i)=>c.fillText(l,o.x-ox,o.y-oy+i*o.tam*1.25));c.restore();return}
    if(o.t==="reta"){linha(c,[[o.x-ox,o.y-oy],[o.x+o.w-ox,o.y+o.h-oy]]);c.restore();return}
    const b=caixa(o),x=b.x-ox,y=b.y-oy,w=b.w,hh=b.h,cx=x+w/2;
    const cam=caminho(o.t,x,y,w,hh);
    if(cam){if(o.fill){c.save();c.globalAlpha=.2;c.fill(cam);c.restore()}c.stroke(cam);
      if(o.t==="trir"){const s=Math.min(w,hh)*.12;linha(c,[[x+s,y+hh],[x+s,y+hh-s],[x,y+hh-s]])}
      c.restore();return}
    switch(o.t){
      case "eixos":{c.font="italic 18px Georgia,serif";seta(c,x,y+hh/2,x+w,y+hh/2);seta(c,cx,y+hh,cx,y);c.fillText("x",x+w-12,y+hh/2+22);c.fillText("y",cx+10,y+14);c.fillText("O",cx-18,y+hh/2+20);break}
      case "cubo":case "para":{const d=Math.min(w,hh)*.3,x0=x,y0=y+d,x1=x+w-d,y1=y+hh,X0=x+d,Y0=y,X1=x+w,Y1=y+hh-d;
        linha(c,[[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]]);linha(c,[[X0,Y0],[X1,Y0],[X1,Y1]]);
        linha(c,[[x0,y0],[X0,Y0]]);linha(c,[[x1,y0],[X1,Y0]]);linha(c,[[x1,y1],[X1,Y1]]);
        linha(c,[[X0,Y0],[X0,Y1],[X1,Y1]],1);linha(c,[[x0,y1],[X0,Y1]],1);break}
      case "pir":{const FL=[x,y+hh],FR=[x+w*.75,y+hh],BR=[x+w,y+hh*.75],BL=[x+w*.25,y+hh*.75],A=[cx,y];
        linha(c,[FL,FR,BR]);linha(c,[A,FL]);linha(c,[A,FR]);linha(c,[A,BR]);linha(c,[BR,BL,FL],1);linha(c,[A,BL],1);break}
      case "cil":{const ry=Math.min(hh*.12,w*.2),t=y+ry,bt=y+hh-ry;elipse(c,cx,t,w/2,ry,0,7);elipse(c,cx,bt,w/2,ry,0,Math.PI);elipse(c,cx,bt,w/2,ry,Math.PI,2*Math.PI,1);linha(c,[[x,t],[x,bt]]);linha(c,[[x+w,t],[x+w,bt]]);break}

  const SIMB=["±","×","·","≠","≤","≥","≈","∞","π","θ","α","β","γ","Δ","λ","μ","ω","ρ","°","√","²","³","∈","⇒","⇔","→","∠","⊥","∥","△","∑","∫"];

  const TPL=[["Fração","\\frac{|}{}"],["Raiz","\\sqrt{|}"],["Raiz ⁿ","\\sqrt[|]{}"],["xⁿ","^{|}"],["xₙ","_{|}"],["( )","\\left( | \\right)"],["[ ]","\\left[ | \\right]"],["| |","\\left| | \\right|"],["Vetor","\\vec{|}"],["Grau °","^{\\circ}|"],["Σ","\\sum_{i=1}^{n} |"],["∫","\\int_{|}^{} "],["lim","\\lim_{x \\to |} "],["log","\\log_{|}"],["sen","\\operatorname{sen}(|)"],["cos","\\cos(|)"],["tg","\\operatorname{tg}(|)"],["Sistema","\\begin{cases} | \\\\  \\end{cases}"],["Matriz","\\begin{pmatrix} | & \\\\  & \\end{pmatrix}"],["Texto","\\text{|}"]];
  const SIMBEQ=[["±","\\pm "],["×","\\times "],["·","\\cdot "],["≠","\\neq "],["≤","\\leq "],["≥","\\geq "],["≈","\\approx "],["∞","\\infty "],["π","\\pi "],["θ","\\theta "],["α","\\alpha "],["β","\\beta "],["γ","\\gamma "],["Δ","\\Delta "],["λ","\\lambda "],["μ","\\mu "],["ω","\\omega "],["ρ","\\rho "],["∈","\\in "],["⇒","\\Rightarrow "],["⇔","\\Leftrightarrow "],["→","\\to "],["∴","\\therefore "],["∠","\\angle "],["⊥","\\perp "],["∥","\\parallel "]];
  $("kbEqT").innerHTML=TPL.map(([l,t])=>`<button type="button" data-t="${t.replace(/"/g,"&quot;")}">${l}</button>`).join("");
  $("kbEqS").innerHTML=SIMBEQ.map(([l,t])=>`<button type="button" data-t="${t}">${l}</button>`).join("");
  function inserirNoCampo(ta,txt){const i=txt.indexOf("|"),limpo=txt.replace("|",""),a=ta.selectionStart,b=ta.selectionEnd;
    ta.value=ta.value.slice(0,a)+limpo+ta.value.slice(b);const pos=a+(i>=0?i:limpo.length);ta.focus();ta.setSelectionRange(pos,pos);ta.dispatchEvent(new Event("input"))}
  $("kbTx").addEventListener("click",e=>{const b=e.target.closest("button");if(b)inserirNoCampo($("txTxt"),b.dataset.s)});
  ["kbEqT","kbEqS"].forEach(id=>$(id).addEventListener("click",e=>{const b=e.target.closest("button");if(b)inserirNoCampo($("eqTxt"),b.dataset.t)}));
  function fecharModais(){document.querySelectorAll(".modal").forEach(m=>m.classList.remove("on"))}
  document.querySelectorAll(".modal").forEach(m=>m.addEventListener("pointerdown",e=>{if(e.target===m)fecharModais()}));

  // --- texto ---
  let txAlvo=null,txPos=null;
  function abrirTexto(o,p){txAlvo=o;txPos=p;$("txTxt").value=o?o.txt:"";$("txTam").value=o?String([22,30,42,60].reduce((a,b)=>Math.abs(b-o.tam)<Math.abs(a-o.tam)?b:a)):$("txTam").value;$("txOk").textContent=o?"Salvar":"Inserir no quadro";$("mTx").classList.add("on");setTimeout(()=>$("txTxt").focus(),30)}
  $("txCanc").addEventListener("click",fecharModais);
  $("txOk").addEventListener("click",()=>{const t=$("txTxt").value.replace(/\s+$/,"");fecharModais();if(!t)return;
    if(txAlvo){const antes={x:txAlvo.x,y:txAlvo.y,w:txAlvo.w,h:txAlvo.h,tam:txAlvo.tam,txt:txAlvo.txt};txAlvo.txt=t;txAlvo.tam=+$("txTam").value;medirTexto(txAlvo);camada().undo.push({tipo:"mover",o:txAlvo,antes});sujo=true;return}
    const o={k:"texto",txt:t,tam:+$("txTam").value,cor:S.cor,x:txPos?txPos[0]:W/2-100,y:txPos?txPos[1]:off()[1]+H/2};medirTexto(o);addObj(o)});
  $("txTxt").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.ctrlKey){e.preventDefault();$("txOk").click()}});

  // --- equação (MathJax, carregado só quando precisa) ---
  let mj=null;
  function carregarMJ(){if(mj)return mj;mj=new Promise((ok,erro)=>{
    window.MathJax={svg:{fontCache:"none"},startup:{typeset:false,ready:()=>{MathJax.startup.defaultReady();MathJax.startup.promise.then(ok)}}};
    const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js";sc.onerror=()=>{mj=null;erro()};document.head.appendChild(sc)});return mj}
  function svgDaEq(tex,cor,px){const n=MathJax.tex2svg(tex,{display:true}),svg=n.querySelector("svg");
    const ew=parseFloat(svg.getAttribute("width")),eh=parseFloat(svg.getAttribute("height"));svg.setAttribute("width",ew*px);svg.setAttribute("height",eh*px);svg.style.color=cor;svg.setAttribute("color",cor);
    svg.querySelectorAll("[fill='currentColor'],[stroke='currentColor']").forEach(el=>{if(el.getAttribute("fill")==="currentColor")el.setAttribute("fill",cor);if(el.getAttribute("stroke")==="currentColor")el.setAttribute("stroke",cor)});
    svg.setAttribute("fill",cor);svg.setAttribute("stroke",cor);return svg}
  async function equacaoImg(tex,cor){await carregarMJ();const svg=svgDaEq(tex,cor,20);
    const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(svg));
    const img=new Image();await new Promise((ok,erro)=>{img.onload=ok;img.onerror=erro;img.src=url});return {img,ratio:img.naturalHeight/img.naturalWidth}}
  let eqAlvo=null,eqTimer;
  function abrirEq(o){eqAlvo=o;modo("quadro");$("eqTxt").value=o?o.eq:"";$("eqOk").textContent=o?"Salvar":"Inserir no quadro";$("mEq").classList.add("on");setTimeout(()=>$("eqTxt").focus(),30);previa();
    carregarMJ().then(previa).catch(()=>{$("eqPrev").textContent="Sem internet para carregar o editor de equações."})}
  function previa(){const t=$("eqTxt").value.trim(),pv=$("eqPrev");if(!t){pv.textContent="Pré-visualização";return}if(!window.MathJax||!MathJax.tex2svg){pv.textContent="Carregando…";return}
    pv.innerHTML="";pv.appendChild(svgDaEq(t,"#16213a",18))}
  $("eqTxt").addEventListener("input",()=>{clearTimeout(eqTimer);eqTimer=setTimeout(previa,150)});
  $("eqTxt").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.ctrlKey){e.preventDefault();$("eqOk").click();return}
    if(e.key==="Tab"){e.preventDefault();const ta=e.target,v=ta.value,i=v.indexOf("{}",ta.selectionEnd);const pos=i>=0?i+1:v.length;ta.setSelectionRange(pos,pos)}});
  $("eqCanc").addEventListener("click",fecharModais);
  $("eqOk").addEventListener("click",async()=>{const t=$("eqTxt").value.trim();if(!t){fecharModais();return}
    try{const cor=eqAlvo?eqAlvo.cor:S.cor,r=await equacaoImg(t,cor);fecharModais();
      if(eqAlvo){const o=eqAlvo,antes={x:o.x,y:o.y,w:o.w,h:o.h};const esc=o.w/o.img.naturalWidth;o.img=r.img;o.ratio=r.ratio;o.eq=t;o.w=r.img.naturalWidth*esc;o.h=o.w*o.ratio;camada().undo.push({tipo:"mover",o,antes});sujo=true;return}
      const w=r.img.naturalWidth,hh=r.img.naturalHeight,c=centro(w,hh);addObj({k:"img",img:r.img,ratio:r.ratio,eq:t,cor,x:c.x,y:c.y,w,h:hh});aviso("Equação inserida · clique duplo nela para editar")}
    catch(e){aviso("Não foi possível criar a equação (sem internet?)")}});
  // clique duplo com o Mouse: editar texto ou equação
  cv.addEventListener("dblclick",e=>{if(S.modo!=="quadro")return;const p=ponto(e),o=[...camada().objs].reverse().find(o=>dentro(o,p));if(!o)return;
    if(o.k==="texto")abrirTexto(o,null);else if(o.eq)abrirEq(o)});

  // ================= SETOR E: ações =================
  function desfazer(){
    const c=camada(),u=c.undo.pop();if(!u)return;if(u.tipo==="delgrp"||u.tipo==="limpou")selecionarGrupo(null);
    if(u.tipo==="traco")c.strokes=c.strokes.filter(s=>s!==u.s);
    else if(u.tipo==="apagou")c.strokes.push(...u.itens);
    else if(u.tipo==="limpou"){c.strokes=u.itens;c.objs=u.objs}
    else if(u.tipo==="obj"){c.objs=c.objs.filter(o=>o!==u.o);if(S.sel===u.o)selecionar(null)}
    else if(u.tipo==="delobj")c.objs.splice(u.i,0,u.o);
    else if(u.tipo==="mover")Object.assign(u.o,u.antes);
    else if(u.tipo==="estado")restaurar(u.f);
    else if(u.tipo==="delgrp"){c.strokes.push(...u.g.strokes);c.objs.push(...u.g.objs)}
    sujo=true;
  }
  function limpar(){const c=camada();if(!c.strokes.length&&!c.objs.length)return;c.undo.push({tipo:"limpou",itens:c.strokes,objs:c.objs});c.strokes=[];c.objs=[];selecionar(null);selecionarGrupo(null);sujo=true;aviso("Tela limpa — Desfazer traz de volta")}
  function ferramenta(t){if(t==="texto")modo("quadro");if(t!=="hand"&&t!=="eraser"&&t!=="texto"&&t!=="sel")ultimaEscrita=t;S.tool=t;document.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));app.classList.toggle("mao",t==="hand");if(t!=="hand"&&t!=="sel"){selecionar(null);selecionarGrupo(null)}}
  function modo(m){
    if(S.modo===m)return;
    S.modo=m;app.classList.toggle("quadro",m==="quadro");selecionar(null);selecionarGrupo(null);
    $("bAula").setAttribute("aria-pressed",m==="aula");$("bQuadro").setAttribute("aria-pressed",m==="quadro");
    pagina();sujo=true;
  }
  function pagina(){$("pg").textContent=(S.page+1)+" / "+S.pages.length;$("bAnt").disabled=S.page===0;$("bProx").disabled=S.page===S.pages.length-1}
  function irPagina(i){S.page=i;selecionar(null);selecionarGrupo(null);pagina();sujo=true}
  function nova(){S.pages.push(novaPagina());irPagina(S.pages.length-1)}
  function salvar(){
    if(S.modo!=="quadro")return;
    const alt=Math.min(16000,Math.max(H,Math.ceil(fimConteudo(camada())+40)));
    const oc=document.createElement("canvas");oc.width=W;oc.height=alt;const c=oc.getContext("2d");
    cena(c,W,alt,0,0,false);
    const a=document.createElement("a"),d=new Date();
    a.download=`quadro_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}_pag${S.page+1}.png`;
    a.href=oc.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();aviso("Página inteira salva na pasta Downloads");
  }
  function abrir(url){S.aula=url;fr.src=url;$("vazio").style.display=url?"none":"";S.sx=S.sy=0;modo("aula");ferramenta("hand");
    if(url)aviso("Aula aberta. T alterna entre Mouse (clicar) e Caneta (escrever).")}
  let tt;function aviso(t){if(!t)return;const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2800)}

  // ================= SETOR F: botões =================
  $("sel").addEventListener("change",e=>{const v=e.target.value;if(v==="__local"){$("local").click();return}abrir(v)});
  $("local").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;
    abrir(URL.createObjectURL(f.name.toLowerCase().endsWith(".pdf")?new Blob([f],{type:"application/pdf"}):new Blob([f],{type:"text/html"})))});
  $("bAula").addEventListener("click",()=>modo("aula"));
  $("bQuadro").addEventListener("click",()=>modo("quadro"));
  document.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>ferramenta(b.dataset.t)));
  document.querySelectorAll(".cor").forEach(b=>b.addEventListener("click",()=>{S.cor=b.dataset.c;document.querySelectorAll(".cor").forEach(x=>x.setAttribute("aria-pressed",x===b));
    if(aplicarCorSel())return;
    if(S.tool==="eraser"||S.tool==="hand"||S.tool==="corr"||S.tool==="texto")ferramenta("pen")}));
  $("corLivre").addEventListener("input",e=>{S.cor=e.target.value;document.querySelectorAll(".cor").forEach(x=>x.setAttribute("aria-pressed","false"));if(!aplicarCorSel()&&(S.tool==="eraser"||S.tool==="hand"||S.tool==="corr"))ferramenta("pen")});
  function aplicarCorSel(){
    if(S.grp){S.grp.strokes.forEach(st=>{if(st.tool!=="corr")st.cor=S.cor});S.grp.objs.forEach(o=>{if(o.k==="forma"||o.k==="texto")o.cor=S.cor;else if(o.eq){o.cor=S.cor;equacaoImg(o.eq,o.cor).then(r=>{o.img=r.img;sujo=true})}});sujo=true;return true}
    const o=S.sel;if(!o)return false;
    if(o.k==="forma"||o.k==="texto"){o.cor=S.cor;sujo=true;return true}
    if(o.eq){o.cor=S.cor;equacaoImg(o.eq,o.cor).then(r=>{o.img=r.img;sujo=true});return true}
    return false}
  document.querySelectorAll(".esp").forEach(b=>b.addEventListener("click",()=>{S.esp=+b.dataset.e;document.querySelectorAll(".esp").forEach(x=>x.setAttribute("aria-pressed",x===b));if(S.sel&&S.sel.k==="forma"){S.sel.esp=S.esp;sujo=true}}));
  $("bUndo").addEventListener("click",desfazer);$("bLimpar").addEventListener("click",limpar);
  $("inserir").addEventListener("change",e=>{const v=e.target.value;e.target.value="";if(!v)return;if(v==="imagem"){$("imgArq").click();return}if(v==="equacao"){abrirEq(null);return}inserirForma(v)});
  $("imgArq").addEventListener("change",e=>{inserirImagem(e.target.files[0]);e.target.value=""});
  $("bExcluir").addEventListener("click",excluir);
  $("girar").addEventListener("change",e=>{const v=e.target.value;e.target.value="";e.target.blur();if(v)girarMenu(v)});
  $("bEq").addEventListener("click",()=>abrirEq(null));
  $("bFill").addEventListener("click",()=>{S.fill=!S.fill;$("bFill").setAttribute("aria-pressed",S.fill);if(S.sel&&S.sel.k==="forma"){S.sel.fill=S.fill;sujo=true}});
  $("fundo").addEventListener("change",e=>{S.fundo=e.target.value;sujo=true});
  $("bAnt").addEventListener("click",()=>{if(S.page>0)irPagina(S.page-1)});
  $("bProx").addEventListener("click",()=>{if(S.page<S.pages.length-1)irPagina(S.page+1)});
  $("bNova").addEventListener("click",nova);$("bSalvar").addEventListener("click",salvar);
  $("bTela").addEventListener("click",()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}});

  // ================= SETOR G: atalhos (também para os botões da caneta Wacom) =================
  function tecla(e){
    if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA"))return;
    const k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();desfazer();return}
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if((k==="delete"||k==="backspace")&&(S.sel||S.grp)){e.preventDefault();excluir();return}
    if(k==="escape"){fecharModais();return}
    if(document.querySelector(".modal.on"))return;
    const m={t:()=>ferramenta(S.tool==="hand"?ultimaEscrita:"hand"),g:()=>ferramenta("sel"),r:()=>ferramenta("reta"),v:()=>ferramenta("vetor"),x:()=>ferramenta("texto"),p:()=>ferramenta("pen"),h:()=>ferramenta("hl"),c:()=>ferramenta("corr"),e:()=>ferramenta("eraser"),m:()=>ferramenta("hand"),
      a:()=>modo("aula"),q:()=>modo("quadro"),l:limpar,n:()=>{modo("quadro");nova()},s:salvar,f:()=>$("bTela").click(),
      home:()=>{if(S.modo==="quadro"){camada().qy=0;sujo=true}},
      "1":()=>document.querySelectorAll(".cor")[0].click(),"2":()=>document.querySelectorAll(".cor")[1].click(),"3":()=>document.querySelectorAll(".cor")[2].click(),"4":()=>document.querySelectorAll(".cor")[3].click(),"5":()=>document.querySelectorAll(".cor")[4].click()};
    if(m[k]){e.preventDefault();m[k]()}
  }
  document.addEventListener("keydown",tecla);
  // depois de usar um menu, devolve o foco à página (para o botão da caneta continuar funcionando)
  document.querySelectorAll(".bar select").forEach(el=>el.addEventListener("change",()=>setTimeout(()=>el.blur(),0)));
  function ligarNaAula(){try{const d=fr.contentWindow.document;d.addEventListener("keydown",tecla);d.addEventListener("paste",colar);d.documentElement.style.colorScheme="light";d.documentElement.setAttribute("data-theme","light")}catch(e){}}
  fr.addEventListener("load",()=>{ligarNaAula();setTimeout(ligarNaAula,1500);setTimeout(ligarNaAula,5000)});
  setInterval(ligarNaAula,4000);

  window.addEventListener("beforeunload",e=>{if(S.pages.some(p=>p.strokes.length||p.objs.length)){e.preventDefault();e.returnValue=""}});

  ferramenta("hand");medir();pagina();loop();
}
</script>
</body>
</html>

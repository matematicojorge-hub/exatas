<style>
:root{color-scheme:light dark;--bg:light-dark(#fbfcff,#0d1422);--ink:light-dark(#16213a,#e8edf7);--soft:light-dark(#55607a,#9aa6bf);--card:light-dark(#fff,#121b2e);--line:light-dark(#d5ddeb,#2a3756);--grid:light-dark(#dfe7f5,#1b2740);--red:light-dark(#d62828,#ff6b6b);--mat:light-dark(#2451c7,#7ea2ff)}
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,Segoe UI,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:420px;width:100%;box-shadow:0 18px 40px -22px rgba(22,33,58,.45)}
.box svg{width:44px;height:44px;color:var(--red)}
h1{font-size:24px;line-height:1.15;margin:10px 0 6px}
p{color:var(--soft);margin:0 0 16px}
label{font-weight:600;display:block;margin-bottom:4px}
input[type=password]{width:100%;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:48px}
input[type=password]:focus{outline:none;border-color:var(--mat)}
.ck{display:flex;gap:8px;align-items:center;font-weight:400;margin:12px 0 16px;color:var(--soft);font-size:15px}
button{width:100%;min-height:50px;border:0;border-radius:10px;background:var(--red);color:#fff;font:700 17px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
#m{color:var(--red);font-weight:600;min-height:1.5em;margin:12px 0 0}
a{color:var(--mat);font-weight:600;text-decoration:none;display:inline-block;margin-top:14px}
.bar{position:fixed;inset:0 0 auto 0;height:56px;display:flex;gap:10px;align-items:center;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line)}
.bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar a{margin:0;border:2px solid var(--mat);border-radius:8px;padding:6px 12px}
iframe{position:fixed;top:56px;left:0;width:100%;height:calc(100% - 56px);border:0}

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K="senha:"+location.pathname;
async function abrir(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.i,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.v)},key,u(D.c)));
}
function mostrar(bytes){
  if(D.t==="html"){const h=new TextDecoder().decode(bytes);document.open();document.write(h);document.close();try{document.documentElement.style.colorScheme="light";document.documentElement.setAttribute("data-theme","light")}catch(e){}return}
  const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
  document.body.innerHTML='<div class="bar"><b></b><a target="_blank" rel="noopener">Abrir em tela cheia</a><a>Baixar PDF</a></div><iframe title="PDF"></iframe>';
  document.querySelector(".bar b").textContent=document.title;
  const l=document.querySelectorAll(".bar a");l[0].href=url;l[1].href=url;l[1].download=D.n;
  document.querySelector("iframe").src=url;
}
async function tentar(pw,lembrar){
  const b=document.getElementById("b"),m=document.getElementById("m");
  b.disabled=true;b.textContent="Abrindo…";m.textContent="";
  try{const bytes=await abrir(pw);try{if(lembrar)localStorage.setItem(K,pw)}catch(e){}mostrar(bytes);return true}
  catch(e){try{localStorage.removeItem(K)}catch(x){}m.textContent="Senha incorreta. Confira com o professor.";b.disabled=false;b.textContent="Abrir";return false}
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();tentar(document.getElementById("s").value,document.getElementById("lem").checked)});
let g=null;try{g=localStorage.getItem(K)}catch(e){}
if(g)tentar(g,false);
}
